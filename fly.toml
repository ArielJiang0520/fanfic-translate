# fly.toml app configuration file
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fanfic-translate'
primary_region = 'sjc'

[build]

[env]
  # Lives on the mounted volume so the database survives deploys and machine restarts.
  DB_PATH = '/data/app.db'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[mounts]
  source = "fanfic_data"
  destination = "/data"
